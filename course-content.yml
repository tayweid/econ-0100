        title: Trade
        description: Trade based on comparative advantage makes both parties better off simultaneously.
        episode:
          video: v_s4dO1AD5Y
          description: Trade
        reading:
          name: Reading A3
          description: No reading in this block
        vignette:
          description: Trade practice problems
        dates:
          class: '2026-09-02'
          recitation: '2026-09-04'
          homework: '2026-09-06'

      - checkpoint:
