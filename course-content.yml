# Edit this file, then run: scripts/build-course
#
# Each block renders as the episode (+ reading) on the left and the practice
# path on the right: exercise in class, vignette in recitation, homework at
# home. Titles, thumbnails, icons, navigation anchors, and conventional
# filenames are generated automatically.
#
# Optional per block:
#   dates:                 # yyyy-mm-dd; the page marks the current step
#     class: '2026-08-31'
#     recitation: '2026-09-04'
#     homework: '2026-09-06'
#   exercise:              # only if the in-class exercise has downloads or a video
#     links: [{label: Exercise, file: Classwork/Classwork_A1.pdf}]
#     video: <youtube id>  # also allowed on vignette: and homework: — shows a small thumbnail on the step
#   extras:                # optional material; sits on the path above the episode
#     - name: Simulating a Market
#       video: <youtube id>

parts:
  A:
    title: The Core Economic Idea
    tagline: better choices can benefit everyone
    links: [{label: Skillsheet, file: Skillsheets/A_Skillsheet.pdf}]
    introduction: >-
      Part A explores one of the most profound insights in all of social science: we have both preferences and scarcity which means every choice requires giving something up, and that measuring the cost of a choice by the value of what we give up, there turns out to be a fundamental reason to coordinate with others. These concepts explain why we specialize, why cities flourish, and how strangers working together can create prosperity that benefits everyone. These are the models that make it possible to see the invisible forces that make civilization possible.
    homework_defaults:
      due: Sunday, September 4
    sections:
      - block: A0
        nav: Econ
        steps:
          - name: Syllabus Quiz
            where: home
            due: Sunday, August 30
            links: [{label: Syllabus, file: Syllabus.pdf}]
        title: What is microeconomics?
        description: >-
          Microeconomics is about how we make decisions under constraints that arise from having both preferences and scarcity.
        episode:
          video: qMDU1QYKYss
          description: Economics is not *about* money.
        reading:
          chapter: 1
          topic: Welcome to economics

      - block: A1
        nav: PPF
        title: The production possibility frontier
        description: The PPF shows us what's attainable as individuals and as a society.
        episode:
          video: po4kip5m_QY
          links: [{label: Animations, file: animations/A1/, icon: fa fa-desktop}]
          description: The landscape of what's possible
        reading:
          chapter: 2
          topic: Choice in a world of scarcity
        exercise:
          links: [{label: Exercise, file: Exercises/Exercise_A1.pdf}]
        vignette:
          description: PPF practice problems
        homework:
          file: A1
        dates:
          class: '2026-08-26'
          recitation: '2026-09-04'
          homework: '2026-08-30'

      - block: A2
        nav: Specialization
        title: Comparative advantage and specialization
        description: >-
          Minimizing opportunity cost by specializing in one's comparative advantage can bend out the PPF.
        episode:
          video: nclNGfY-3eA
          description: Specialization
        reading:
          chapter: 19
          topic: International trade
        vignette:
          description: Specialization practice problems
        dates:
          class: '2026-08-31'
          recitation: '2026-09-04'
          homework: '2026-09-06'

      - block: A3
