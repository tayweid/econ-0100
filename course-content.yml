# Edit this file, then run: scripts/build-course
#
# Each block renders as the episode (+ reading) on the left and the practice
# path on the right: exercise in class, vignette in recitation, homework at
# home. Titles, thumbnails, icons, navigation anchors, and conventional
# filenames are generated automatically.
#
# Optional per block:
#   dates:                 # yyyy-mm-dd; the page marks the current step
#     class: '2026-08-31'
#     recitation: '2026-09-04'
#     homework: '2026-09-06'
#   exercise:              # only if the in-class exercise has downloads or a video
#     links: [{label: Exercise, file: Classwork/Classwork_A1.pdf}]
#     video: <youtube id>  # also allowed on vignette: and homework: — shows a small thumbnail on the step
#   extras:                # optional material; sits on the path above the episode
#     - name: Simulating a Market
#       video: <youtube id>

parts:
  A:
    title: A Very Big Idea
    tagline: specialization and trade can benefit everyone
    introduction: >-
      Part A explores one of the most profound insights in all of social science: why humans have a fundamental drive to cooperate and coordinate with one another. The ideas you'll discover here — opportunity cost, the production possibility frontier, and comparative advantage—reveal that cooperation isn't just nice, it's economically inevitable. These concepts explain why we specialize, why cities flourish, and how strangers working together can create prosperity that benefits everyone. These aren't just abstract theories; they're the invisible forces that make civilization possible.
    homework_defaults:
      due: Sunday, September 4
      file: A
      solutions: true
    sections:
      - block: A1
        nav: Econ
        title: What is microeconomics?
        description: >-
          Microeconomics is about how we make decisions under constraints that arise from having both preferences and scarcity.
        episode:
          video: qMDU1QYKYss
          description: What is microeconomics?
        reading:
          chapter: 1
          topic: The principles of microeconomics
        vignette:
          description: No vignette in this block
        dates:
          class: '2026-08-24'
          recitation: '2026-08-28'
          homework: '2026-08-30'

      - block: A2
        nav: PPF
        title: The production possibility frontier
        description: The PPF shows us what's attainable as individuals and as a society.
        episode:
          video: po4kip5m_QY
          description: The landscape of what's possible
        reading:
          chapter: 2
          topic: Thinking like an economist
        vignette:
          description: PPF practice problems
        dates:
          class: '2026-08-26'
          recitation: '2026-08-28'
          homework: '2026-08-30'

      - block: A3
        nav: Specialization
        title: Comparative advantage and specialization
        description: >-
          Minimizing opportunity cost by specializing in one's comparative advantage can bend out the PPF.
